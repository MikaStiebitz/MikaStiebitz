name: README graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/readme/**"
      - "readme.config.json"
      - ".github/workflows/readme.yml"
  # A visitor leaves a commit by opening an issue titled "commit: <message>".
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Runs queue up instead of cancelling each other, so no visitor issue is dropped half-way.
concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'commit:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect visitor commits
        run: node scripts/readme/visitors.mjs collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render README
        run: node scripts/readme/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT (read:user) so private contributions count too.
          README_TOKEN: ${{ secrets.README_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): rebuild graph"
          git push || (git pull --rebase && git push)

      - name: Answer and close visitor issues
        run: node scripts/readme/visitors.mjs close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
