name: README heartbeat

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/readme/**"
      - "readme.config.json"
      - ".github/workflows/readme.yml"

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render README
        run: node scripts/readme/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT (read:user) so private contributions count toward the pulse.
          README_TOKEN: ${{ secrets.README_TOKEN }}
          # Optional: needed unless your WakaTime stats are public.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet && exit 0
          git commit -m "chore(readme): heartbeat $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
